# scan-sorter printer share (docs/PLAN.md, "Components").
#
# One share, one low-privilege user, no SMB1. The share maps only to the inbox
# volume; the worker moves finished scans out of it into a private spool.
# Settings marked "printer matrix" may need relaxing for older printers; see
# docs/printers.md before changing them.

[global]
    server role = standalone server
    server string = scan-sorter
    # SMB1 is never enabled. SMB2_02 is the oldest dialect most HP printers
    # with SMB2 support speak (printer matrix).
    server min protocol = SMB2_02
    client min protocol = SMB2_02
    smb ports = 445
    disable netbios = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    # Only the dedicated scanner account, no guests.
    map to guest = never
    restrict anonymous = 2
    usershare allow guests = no
    ntlm auth = ntlmv2-only
    # Signing and encryption are offered; printers that support them use them
    # (printer matrix: some firmware cannot do mandatory signing).
    server signing = auto
    smb encrypt = if_required
    # No symlink tricks through the share.
    follow symlinks = no
    wide links = no
    allow insecure wide links = no
    unix extensions = no
    log level = 1
    logging = file
    log file = /var/log/samba/%m.log
    max log size = 1000

[scans]
    path = /inbox
    valid users = scanner
    read only = no
    browseable = no
    # Files land group-readable for the worker (same GID), never world-readable.
    force user = scanner
    force group = scansorter
    create mask = 0660
    force create mode = 0660
    directory mask = 0770
    force directory mode = 0770
    inherit permissions = no
    store dos attributes = no
    ea support = no
    vfs objects =
