[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scan-sorter"
version = "0.0.1"
description = "Self-hosted, local-only document sorter for home scanners"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["pikepdf==10.16.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
scan-sorter = "scan_sorter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scan_sorter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
